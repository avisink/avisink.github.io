<!doctype html>
<!--
  Stable link: avisink.github.io/watch
  To point it at a new video, replace the YouTube URL in all three places below (meta refresh, script, fallback link).
  GitHub Pages can't send a real 302, so this redirects in the browser instead.
  Unlike a 301, nothing here gets cached as permanent, so updates take effect on the next deploy.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Redirecting to YouTube…</title>
    <meta http-equiv="refresh" content="0; url=https://youtu.be/rPG2KW6_0ys" />
    <script>
      window.location.replace('https://youtu.be/rPG2KW6_0ys')
    </script>
  </head>
  <body style="background:#10002b;color:#e0aaff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0">
    <p>Taking you to the video… <a href="https://youtu.be/rPG2KW6_0ys" style="color:#c77dff">click here</a> if nothing happens.</p>
  </body>
</html>
